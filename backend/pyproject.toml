[project]
name = "gymplanner"
version = "0.1.0"
description = "Data-driven equipment selection and floor-layout engine for gyms"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "pyyaml>=6.0", "numpy>=1.26"]

[dependency-groups]
dev = ["pytest>=8.0", "httpx2>=2.16", "ruff>=0.6", "mypy>=1.11", "types-pyyaml>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gymplanner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E261", "E501", "RUF001", "RUF002", "RUF003"] # Inline comments use one space and may exceed the preferred width.

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true

version: 1
default_grade: commercial
grades:
- id: value
  name: Value
  description: 'Light- and budget-commercial lines such as Spirit 800-series, Star Trac 4-series, Body-Solid,
    French Fitness, REP and Titan: the lowest new prices, suited to amenity rooms, studios and lighter
    traffic. Some value strength gear is sold for home gyms, so choose commercial-rated models.'
  price_tier: value
  multiplier: 1.0
  sources:
  - fitness-exchange-product-catalog-2026
  - fitness-superstore-catalog-new-2026
  - fitness-superstore-catalog-new-body-2026
  - rep-fitness-online-catalog-products-2026
  - titan-fitness-online-catalog-2026
  - bells-steel-us-online-catalog-2026
- id: commercial
  name: Commercial
  description: Mainstream club equipment built for all-day, multi-user traffic, such as Life Fitness Integrity
    and Axiom, Star Trac 6-series, Precor 600 line, Hoist, Nautilus Instinct and Impact, and Rogue Monster.
    Priced from dealer and manufacturer list prices; multi-unit orders are often negotiated lower.
  price_tier: commercial
  multiplier: 1.0
  sources:
  - life-fitness-us-online-store-products-2026
  - life-fitness-us-online-store-hammer-2026
  - fitness-exchange-product-catalog-2026
  - top-fitness-precor-dealer-catalog-2026
  - push-pedal-pull-catalog-precor-2026
  - hoist-fitness-online-catalog-cf-club-2026
  - fitness-superstore-catalog-new-body-2026
  - rogue-fitness-product-category-pages-2026
- id: premium
  name: Premium
  description: Top club lines, with touchscreen consoles on the cardio, such as Hammer Strength, Life
    Fitness Insignia, Precor 800 line, Star Trac 10-series, Woodway, Prime Evolution and Sorinex. Some
    are sold by quote only.
  price_tier: premium
  multiplier: 1.0
  sources:
  - life-fitness-us-online-store-hammer-2026
  - top-fitness-precor-dealer-catalog-2026
  - fitness-superstore-catalog-new-2026
  - total-fitness-usa-catalog-woodway-2026
  - prime-fitness-usa-online-catalog-2026
  - sorinex-product-pages-embedded-price-2026
- id: refurbished
  name: Refurbished
  description: Remanufactured previous-generation club equipment (Life Fitness, Precor, Hammer Strength,
    Cybex, StairMaster and similar, from remanufacturers such as CTX Home Gyms and Fitness Superstore),
    priced on average across a plan at 60% of new commercial-grade prices. Remanufactured cardio sells
    for about half the new commercial price and selectorized machines for about two-thirds; free weights
    and functional gear have little refurbished market. Warranties are shorter and models depend on what
    is in stock.
  price_tier: commercial
  multiplier: 0.6
  sources:
  - ctx-home-gyms-remanufactured-catalog-2026
  - ctx-home-gyms-remanufactured-commercial-2026
  - fitness-superstore-catalog-new-2026
  - fitness-superstore-catalog-new-body-2026
  - life-fitness-us-online-store-hammer-2026
  - rogue-fitness-echo-bike-refurbished-2026
  - club-solutions-magazine-article
  - derived-sp-refurbished-multiplier

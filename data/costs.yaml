- id: dropzone_19mm
  name: 19 mm (3/4 in) drop-zone tiles
  cost_per_sqft:
    low: 5.5
    typical: 8.5
    high: 11.0
  sources:
  - dg-floors-gym-flooring-cost-2026
  - livefit-guardian-shok-lok-2-x-2026
  - greatmats-kyle-schurman-what-kind-flooring
  - derived-sp-flooring-installed
  notes: 'For racks and lifting areas where bars are dropped (Greatmats: 3/4 in for intentional drops).
    Heavy 3/4-1 in mats cost $5-8 per sq ft (DG Floors) and the Guardian Shok-Lok 18 mm tile $7.96; mostly
    loose-laid, so little labor. Not assigned to a zone by default; lifting platforms are priced as equipment.'
- id: turf_rubber
  name: Turf and rubber (functional zone)
  cost_per_sqft:
    low: 2.5
    typical: 6.0
    high: 9.0
  sources:
  - dg-floors-gym-flooring-cost-2026
  - fitness-superstore-french-gym-turf-roll-2026
  - bells-steel-roll-gym-turf-2-m-2026
  - titan-fitness-artificial-turf-15-ft-x-2026
  - fitness-superstore-french-14-ft-x-50-2026
  - derived-sp-flooring-installed
  notes: 'Functional zone floor: turf for sled work and rubber around rigs. Turf lists at $1.26-6.71 per
    sq ft (French Fitness rolls, Bells of Steel, Titan, French Fitness marked track) and $4-7 for indoor
    turf strips (DG Floors), plus an installation allowance; the 8 mm and 12 mm rubber rates above bracket
    the rubber part. Low confidence. Turf lanes are also priced as equipment (turf_lane), so the lane''s
    own area is counted twice; the overlap is small.'
installation_rate: 0.12
installation_sources:
- ntai-fitness-gym-equipment-cost-estimator
- hoist-fitness-store-incl-assembly-white-2026
- fitness-exchange-product-catalog-2026
- isellfitness-catalog-incl-installation-2026
- concept2-rowerg-specifications
- derived-sp-installation-rate
notes: Prices are 2026 USD before sales tax. A grade picks one price tier from the equipment catalog (refurbished
  also applies its multiplier). Commercial and premium tiers come mostly from list prices, and some lines
  are quote-only; the price fact-check estimates real purchase prices 10-30% below these values, so planned
  equipment costs lean high. Freight, delivery and installation add installation_rate (12%) to the equipment
  cost. Flooring rates are installed costs (material plus labor). The planner blends the zone rates by
  the share of time members spend in each zone and applies the blend to the whole training floor.

  notes: 'Price = 550 lb x tier $/lb + one 10-pair two-tier rack. Value: dumbbells 550 lb x 1.85 rubber
    hex (1,017.50) + rack 770 = 1,787.50 -> 1,800. Commercial: dumbbells 550 lb x 2.90 rubber hex (1,595)
    + rack 1,600 = 3,195 -> 3,200. Premium: dumbbells 550 lb x 9.56 Hammer Strength 4-sided urethane 5-50
    set rate (5,258) + rack 1,600 = 6,858 -> 6,850. Cross-checks: REP hex 5-50 $1,099.99 + REP commercial
    2-tier rack $649.99 = $1,749.98; LF rubber hex 5-50 $1,694 + LF 3-tier hex rack $1,549 = $3,243; HS
    4-sided urethane 5-50 $5,256 + HS two-tier rack $1,756 = $7,012. Footprint 24 x 87 x 33 in = median
    of LF two-tier 25 x 90 x 33 and HS 21 x 90 x 33 (both rated for 10 pairs), REP Victory 24 x 84 and
    REP commercial 23.3 x 84.2. Clearance: front 72 in = NSCA''s 4 ft standing-exercise user depth + the
    ISO 20957-1 0.6 m free area (derived-eqfw-storage-front-zone); it contains the 36 in pick-up depth
    the LF and HS live areas add in front (they add nothing at the ends or back) and holds the standing
    curls, raises and shrugs done at the rack. Back 0 so it sits against the wall (NSCA TSAC: dumbbell
    racks along walls), ends 0 so racks butt together. stations 3 (derived-eqfw-pool-capacity): with two
    users already holding pairs a newcomer gets the exact pair 70% and a usable pair 97% of the time;
    with three, 56% and 89%.'

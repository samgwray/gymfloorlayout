    spanning a ~48 in bench. Front 24 in = ISO 20957-1 0.6 m free area for the feet and access; back 12;
    36 in past each bar end (NSCA). Envelope 96 x 159 in = 106 sq ft (NSCA supine station 90, TSAC 156).

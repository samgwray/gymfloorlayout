    5 pairs and 1,400 lb per tier with a 150 lb maximum dumbbell, so the 130-150 lb tier (1,400 lb) is
    exactly at its rating, and HS says its racks are optimized for dumbbells under 125 lb; budget a second
    rack if the heads do not fit (fact-check flag). Same footprint and clearances as the 5-50 lb rack
    (front 72 in, back 0). stations 2 (derived-eqfw-pool-capacity): heavy users ramp through two adjacent
    pairs (3 if each holds one). Requires dumbbell_set_full (canonical spec): the heavy pairs are an add-on
    to a complete 5-100 lb run used for warm-ups and lighter work.'

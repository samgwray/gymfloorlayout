  notes: 'Main aisle 60 in: meets the ADA passing-space and turning-space widths (403.5.3, 304.3), so
    no separate 60 x 60 in passing spaces are needed, and matches NSCA''s 60-in hallway. Secondary aisles
    36 in: the ADA 403.5.1 accessible-route minimum and NSCA''s 36-in passageway. Gyms typically leave
    48 in between rows (Skelcore calls 48 in the comfortable everyday standard and 36 in the bare minimum;
    Rush Walter prefers 48 in). The planner uses 36 in because equipment clearance zones may overlap walkways
    (DOJ guidance lets the 30 x 48 in clear floor space sit in the aisle behind a machine), and every
    unit still keeps an approach zone at least as deep as its own clearance.'

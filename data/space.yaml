notes: 'The user''s area is the training floor: the space for equipment, aisles and stretching. Reception,
  locker rooms and restrooms are the operator''s to add and are not part of it. Aisles take about 17.5% (circulation_share,
  range 15-20%). During equipment selection each unit claims its footprint plus half of each clearance
  (neighbouring clearances and aisles may overlap), and the sum of those claims may use up to packing_efficiency
  = 0.65 of the training floor. Aisles and wall-facing clearances alone would allow about 0.78 (1 - 0.175
  - 0.05), but zone boundaries, the main aisle and part-filled rows leave less: in the five sample scenarios
  the final plans claim about 0.37 of the training floor at 750 sq ft, 0.48 at 1,200, 0.56 at 3,750 and
  0.63-0.65 at 7,000-12,500 sq ft. Planet Fitness agrees: its 116-152 sq ft of building per piece is 64-94
  sq ft of training floor at a 0.55-0.62 training share, and the catalog''s pieces claim about 48 sq ft
  each in a big-box plan, a ratio of 0.51-0.74. Whenever units
  do not fit, the plan is re-made on less area, so small rooms settle below the starting value. The default
  ceiling of 144 in (12 ft) is the NSCA and UFC minimum for overhead lifting and lies inside Sport England''s
  optimum of 3.5-4 m (138-157 in). Users with lower rooms should enter their height, which removes equipment
  that needs more headroom: below 12 ft the rigs, wall-ball targets and lifting platforms, below 9 ft
  also racks, treadmills and stair climbers.'

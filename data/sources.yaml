- id: derived-eqcf-cardio-footprint-p75
  title: 'Cardio footprints: 75th percentile of commercial flagship dimensions'
  kind: derived
  notes: 'Length, width and height of each cardio unit are about the 75th percentile (linear interpolation)
    of the published dimensions of the commercial flagship models collected in the cardio/functional footprint
    research (Life Fitness, Precor, Star Trac, StairMaster, Matrix, Keiser, Schwinn, Woodway, TrueForm,
    Assault, Rogue, Concept2, NuStep, SciFit), rounded up to the next inch so a typical-to-large purchase
    still fits. Fact-check correction applied: elliptical length 87 in (Star Trac 8RDE at 86 in added
    to the sample; Life Fitness Integrity active length 87 in). Heights use the same percentile over the
    same models.'
- id: derived-eqcf-price-tier-medians
  title: 'Equipment price tiers: medians of current US listings'
  kind: derived
  notes: 'Each tier price is the median of current new US selling prices seen on 2026-10-28 for that item
    and tier (value = light or budget commercial lines, commercial = mainstream club lines, premium =
    top club lines and touchscreen consoles), rounded to $50 above $1,000 and to $10 between $100 and
    $1,000; tax, freight and installation are excluded. Fact-check corrections applied: recumbent bike
    value $3,000 (a floor-model listing replaced by the cheapest new variant) and rig bay premium about
    $1,700 per bay (Rogue Monster Rig 2.0 Racked Edition, $1,469-$1,828 per bay, the same frame-only scope
    as the other tiers). One scope adjustment: the ski erg value tier adds a $220 floor stand to the $850
    median (see derived-eqcf-ski-erg).'
- id: derived-eqcf-treadmill-ceiling
  title: Minimum ceiling height for treadmill running
  kind: derived
  notes: 76-in design user + 11-in step-up (Star Trac 10TRx, Core 2026 catalog) + about 6 in of incline
    rise at mid-deck (20% x 30 in) + about 4 in of running bounce + 6 in of head margin = 103 in, rounded
    up to 9 ft (108 in); this matches Life Fitness's 9-ft PowerMill requirement. Derived in the space
    research and confirmed by its fact-check; the user height, bounce and margin are assumptions.
- id: derived-eqcf-stair-climber-clearance
  title: Stair climber clearances
  kind: derived
  notes: Back (mounting side) 39 in = "at least 3 ft (1 m) behind" in the Life Fitness PowerMill Integrity
    owner's manual found by the space fact-check (https://cdn.shopify.com/s/files/1/2063/2201/files/Life_Fitness_PowerMill_Integrity_Series_Climber_Owners_Manual.pdf);
    sides 20 in = Precor's 0.5 m rule for non-treadmill cardio, above that manual's 1 ft per side; front
    24 in = the 0.6 m console clearance Technogym and Star Trac draw for treadmills, since no verified
    stepmill manual gives a front value. A StairMaster 10G manual excerpt, seen only via search, asks
    48 in front and behind and 20 in at the sides; use 48 for a strict plan.
- id: derived-eqcf-rower-envelope
  title: Rower clearances from the Concept2 use envelope
  kind: derived
  notes: 'Clearances are set so footprint plus clearance equals Concept2''s "With Clearance for use: 9
    ft x 4 ft" (108 x 48 in): 96-in length + 6 in at each end, and 26-in width (75th percentile of Concept2
    24, Throwdown 26.5 and Life Fitness Row HX 20.5 in) + 11 in on each side.'
- id: derived-eqcf-ski-erg
  title: Ski erg orientation, clearances, ceiling and floor-stand value price
  kind: derived
  notes: 'Concept2 floor stand 23.5 x 50 x 85 in; the record''s front is the platform end where the user
    stands, so the canonical aisle_side "front" puts the user side on the aisle. 24 in behind the user
    and at the sides applies the space research''s ISO 20957-1 0.6 m free-area rule (no maker publishes
    a value); 12 in at the tower end is the footprint research''s estimate. The 96-in (8 ft) minimum ceiling
    is the footprint research''s estimate for an 85-in unit plus handle travel. The canonical item is
    the floor-stand version, but the price research''s value median ($850: Rogue Echo Ski $825, Concept2
    SkiErg $850, BUILT $899) is for units sold without a floor stand; adding Concept2''s $220 standard
    floor stand gives a $1,070 value tier, which equals Rogue''s listing for a Concept2 SkiErg with floor
    stand. Commercial ($1,150) and premium ($1,700) are the research medians, which the price research
    prices with a floor stand ("with floor stand from commercial tier up").'
- id: derived-eqcf-air-bike-clearance
  title: Air bike clearances
  kind: derived
  notes: No air-bike maker publishes a clearance, so 24 in on every side applies the 0.6 m free-area convention
    of ISO 20957-1 (quoted in a CCTS test report) and of the Keiser and Matrix bike manuals; it also keeps
    the fan's airflow off neighbours. The 55 x 30-in footprint covers the AssaultBike Elite's 55.08-in
    length and the Rogue Echo Bike's 29.5-in handle width.
- id: derived-eqcf-cardio-useful-life
  title: Useful life of commercial cardio
  kind: derived
  notes: 'Club cardio with drive electronics or heavy class use (treadmill, elliptical, upright and recumbent
    bikes, indoor cycle, stair climber) uses 6 years: the middle of Planet Fitness''s cardio re-equip
    years 5-7 (investor presentation; 10-K whole-club cycle 5-9 years) and PureGym''s 6-year depreciation
    of fixtures and fittings. Self-powered units without motors (curved treadmill, air bike, rower, ski
    erg, recumbent stepper) use 7 years, the top of that range and the bottom of Rework''s 7-10-year commercial
    cardio life; the price research''s 8-10-year figures for them are unsourced estimates.'
- id: derived-eqcf-recumbent-stepper-transfer
  title: Recumbent stepper wheelchair-transfer clearance
  kind: derived
  notes: NuStep's manuals require 24 in at the sides and 12 in front and rear, plus "additional free space
    ... to accommodate wheelchair access". The right (transfer) side therefore gets 30 in, the depth of
    the ADA 2010 305.3 clear floor space (30 x 48 in) placed for a parallel transfer along the 73-in machine;
    a forward approach needs 48 in.
- id: derived-eqcf-rig-bay
  title: Rig bay size, clearances, ceiling and per-bay price
  kind: derived
  notes: 48 x 48 in per 4-ft bay (Throwdown Alpha XTC 4-ft core 46 x 48 in; Rogue W-4) against a wall;
    the 60-in front zone is Throwdown's recommended floor space (rig footprint + 5 ft per side, verified
    for six XTC layouts), and sides are 0 because that 5 ft applies only at the ends of a run. Ceiling
    144 in = 105-in rig + about 36 in for the torso above the bar in kipping and muscle-ups (space research;
    NSCA 12-ft overhead rule). Per-bay prices divide whole-rig prices by bay count (REP Rig 4000/5000
    from upright counts; Rogue Monster and Monster Lite Rig 2.0 from Rogue's sizing table; premium = Rogue
    Monster Rig 2.0 Racked Edition per the fact-check). The per-bay price is not low for plans with
    one or two bays, because a single wall-mount bay is sold on its own (Rogue W-4 4-ft section, $595,
    checked 2026-10-29); free-standing rigs start at two bays (Rogue Monster Rig 2.0 M-10, $2,365).
- id: derived-eqcf-turf-lane
  title: Turf lane with sled, size and price
  kind: derived
  notes: One 5-ft (60-in) GymTurf-width lane, nominally 50 ft (600 in) and flexible down to 25 ft (300
    in, one 25-ft roll); 36-in run-outs at each end (estimate) make the shortest envelope 372 in, about
    Torque's "only 10 yards of space" minimum, and neighbouring lanes share edges. Price = turf per sq
    ft x 250 sq ft (value $2.06, commercial $7.70, premium $13.30 per sq ft) + one sled (value $290, commercial
    $440, premium $2,150) = $805 / $2,365 / $5,475, rounded to $810 / $2,350 / $5,500, pricing the lane
    by area as the fact-check recommends.
- id: derived-eqcf-plyo-zone
  title: Plyo box set sized for two users
  kind: derived
  notes: Priced sets hold 2-5 boxes (for example two 3-in-1 soft boxes, three Rogue Foam Games Boxes or
    a Powermax set of five), so two users can each work on a box. Footprint = two boxes 30 in wide x 36
    in deep (Throwdown Power Plyo 30 x 36-in base) with a 24-in gap; the 48-in approach and take-off zone,
    36-in landing and step-down zone and 24-in sides are the footprint research's estimates (no vendor
    use-zone guidance found).
- id: derived-eqcf-wall-ball-zone
  title: Wall-ball station size, clearances and ceiling
  kind: derived
  notes: 26 x 48 in at the wall = a medicine-ball rack (Life Fitness vertical storage 25.5 x 25 in) beside
    the throwing spot under a 16-in target; the 60-in throwing zone uses Throwdown's 5-ft working space
    around rigs, and the 12-in sides are estimates. Targets sit at 9-10 ft (Rogue, Titan, Fringe), so
    the space research sets a 12-ft (144-in) ceiling for the throw and the ball, matching NSCA's 12-ft
    overhead rule.
- id: derived-eqcf-battle-rope-lane
  title: Battle rope lane
  kind: derived
  notes: 'The rope loops around the anchor, so the lane is rope length / 2 + 24 in of stance (footprint
    research): 264 in for a 40-ft rope, the low end of the canonical "40-50 ft rope laid out" (204 in
    for 30 ft, 324 in for 50 ft). The priced ropes are 50, 40 and 40 ft (value), 50, 30 and 50 ft (commercial)
    and 50 ft plus one unstated length (premium), so the lane matches the ropes being priced; a 50-ft
    rope fits with the tails trailing behind the athlete. 72 in wide for the wave envelope and athlete
    (estimate). The record''s front is the athlete''s end with 24 in behind the athlete; the anchor end
    (wall, rig post or floor anchor) is the back with no clearance; sides get 12 in.'
- id: derived-eqcf-suspension-zone
  title: Suspension trainer floor zone
  kind: derived
  notes: Anchor 7-9 ft up on a wall or ceiling (TRX). The user's body reaches 6-7 ft from the anchor in
    supine and plank exercises, so the floor zone is 96 in deep x 72 in wide with 12 in around it (footprint
    research estimate) and no clearance at the anchoring wall.
- id: derived-eqcf-heavy-bag-zone
  title: Heavy bag striking zone
  kind: derived
  notes: Zone 54 x 84 in = Throwdown's 4.5-ft bag-rack spacing x the 7-ft recommended floor space of its
    single-station training tree, about 31.5 sq ft per bag (Throwdown's dense bag racks work out to 30.6
    sq ft per bag). It is split into a 24 x 24-in bag or base, 45 in of striking stance in front and 15
    in at the back and sides; the split is an estimate.
- id: derived-eqcf-kettlebell-zone
  title: 'Kettlebell set: users, working zone and price builds'
  kind: derived
  notes: 'A 9-bell set (about 4-32 kg, one bell per weight) lets about two people train at once without
    needing the same bell. Rack 24 x 77 in (Rogue Universal Storage System 2.0); the zone in front gives
    each user NSCA''s 40 sq ft for a standing exercise (space research), laid across the rack width plus
    24 in (ISO 0.6 m) at each end: 80 sq ft / 125 in = about 92 in, rounded to 96 in, which also covers
    the 36-in pick-up aisle. Prices are the strength price research''s builds: Rogue 9-70-lb bells + REP
    rack $1,171; Life Fitness cast iron 4-32 kg + LF 3-tier rack $2,565; Hammer Strength competition 8-32
    kg + LF rack $3,200.'
- id: derived-eqcf-stretch-area
  title: Stretch area per user
  kind: derived
  notes: Footprint 72 x 60 in = a 6-ft mat (Throwdown 21 x 66-in mats; 4 x 6-ft premium floor mats) plus
    about 18 in of movement room each side; 6-in ends and 12-in sides make an 84 x 84-in (49 sq ft) envelope,
    matching NSCA's 7 x 7-ft stretching area and UFC 4-740-02's 50 sq ft per person. In a dense row with
    shared sides each user takes about 42 sq ft, still above Sport England's 2.0-2.5 m2 per person.
- id: derived-eqcf-accessory-pack
  title: 'Accessory pack: users served, storage zone and price'
  kind: derived
  notes: 'The priced pack holds 5 mini bands, 4 loop bands, 4 foam rollers, 4 mats and 2 stability balls
    with storage, so about 4 users can use it at once, on stretch-area mats. Footprint = Life Fitness
    Accessory Storage Rack 36 x 25 x 67 in; the 25-in front zone is the depth Life Fitness adds in the
    SYNRGY storage system''s Recommended Live Area (50 in deep vs a 25-in footprint). Tier prices are
    single bundle builds: $482 (Body-Solid/GoFit/French Fitness), $1,112 (Life Fitness) and $3,866 (Life
    Fitness with its accessory rack).'
- id: derived-eqcf-functional-useful-life
  title: Useful life of functional and mobility equipment
  kind: derived
  notes: 'Steel rig bays 15 years (Legend Fitness 15-year warranty on its suspension-trainer rig; Rework:
    strength equipment 15-20 years); kettlebells and rack 20 years (Rework: free weights 20-30 years;
    benchmarks research: steel and free weights at least 8 years); turf lane 4 years (Rework: turf 3-5
    years; ECORE 5-year commercial warranty), although the sled lasts longer. Soft goods use the price
    research''s estimates: plyo boxes 6, heavy bag 5, suspension straps 4, battle rope and wall balls
    3, mats and accessories 2 years.'
- id: derived-eqfw-overlap-clearance
  title: Free-weight footprints and clearances re-based on the layout engine's overlapping-clearance rule
  kind: derived
  notes: The layout engine lets clearance zones overlap each other and aisles, so the gap between neighbours
    is the larger facing clearance, not the sum that footprint_strength's margins assume (12 in a side
    for a 24 in gap). Stations whose loaded Olympic bar (86.75 in, Rogue Ohio Bar) stays on or with the
    unit get a footprint that contains the bar (racks, Olympic benches and the hip-thrust bench across
    their width, plus NSCA's 36 in past each bar end, which turns the LF/HS 120 in barbell live-area width
    into the row pitch 87 + 36 = 123 in; the landmine, and the hip-thrust bench whose bar rests on the
    floor in front of it, along their length), and the 96 in platform gets 27 in sides because the bar
    already leaves 4.6 in of deck at each end (27 + 4.6 + 4.6 = 36). Other free-weight units get NSCA's
    24 in minimum between stations on sides that face neighbours (36 in, NSCA's optimum, for dumbbell
    benches whose dumbbell arcs take LF's +24 in a side), while front and back zones keep footprint_strength's
    manufacturer live-area values except the half-rack walk-out (derived-eqfw-rack-walkout), the hip-thrust
    bench (derived-eqfw-hip-thrust-footprint) and the standing-work zone in front of wall storage (derived-eqfw-storage-front-zone).
- id: derived-eqfw-bar-station-price
  title: 'Barbell station prices: frame + bar + one plate set + collars + plate tree'
  kind: derived
  notes: Each bar station adds to the price_strength tier median for its rack, bench or platform a 20
    kg bar ($260/$310/$700), one plate set of 355 lb iron at price_strength's station rates ($1.90/$3.10/$5.90
    per lb) or 350 lb of bumpers at its tier medians ($2.10/$3.30/$8.30 per lb), collars ($40/$55/$101)
    and one plate tree for storage ($230/$940/$1,000), rounded to the nearest $50. 355 lb and 350 lb are
    the complete Olympic set sizes REP, French Fitness and Rogue sell (REP Old School and Equalizer 355
    lb, French Fitness 350 lb, Rogue HG 2.0 350 lb), inside the 300-400 lb planning range; no source gives
    plates per station, and the fact-check expects real commercial/premium purchases 10-30% below these
    list-based tier values.
- id: derived-eqfw-dumbbell-price
  title: 'Dumbbell set prices: pair weight x tier $/lb + 10-pair racks'
  kind: derived
  notes: Set weight is twice the sum of pair weights (5-50 lb = 550 lb, 5-100 lb = 2,100 lb, 105-150 lb
    = 2,550 lb). Value and commercial use price_strength's rubber-hex medians ($1.85 and $2.90 per lb,
    nearly flat across weight ranges); premium uses the Hammer Strength 4-sided urethane set rate for
    the same range ($9.56, $7.93 and $6.67 per lb, which falls as weight rises); each 10 pairs add one
    two-tier rack at price_strength's 2-tier medians ($770/$1,600/$1,600); totals are rounded to the nearest
    $50.
- id: derived-eqfw-pool-capacity
  title: Concurrent users per dumbbell or fixed-bar set (pick-up conflict simulation)
  kind: derived
  notes: 'Monte Carlo of users each holding one item drawn from a demand curve with ~70% of 5-50 lb pick-ups
    on the 20-40 lb pairs (GYMetrix: 8-18 kg dumbbells are the most popular kit) and 25% of full-set pick-ups
    above 50 lb; an arrival takes the preferred item, else one weight step away (or the other bar type
    for fixed bars), and 25% of users (all heavy-extension users, who ramp through pairs) also hold a
    second item. Capacity c means the c-th concurrent user still gets the exact item at least 60% and
    a usable item at least 90% of the time: 5-50 lb set 3, 5-100 lb set 5, 105-150 lb set 2 (3 if heavy
    users hold one pair), 10 straight + 10 EZ fixed bars 6.'
- id: derived-eqfw-useful-life
  title: Useful life of racks, benches, platforms and free weights
  kind: derived
  notes: 10 years is the IRS Pub 946 class life for asset class 79.0 (recreation); it sits above Planet
    Fitness's 7-9 year strength re-equip cycle (the benchmarks slice recommends at least 8 years for racks,
    benches and free weights) and below the 15-20 (strength) and 20-30 (free weights) years a Rework vendor
    guide quotes. Lifting platforms get the 8-year machine strength life (benchmarks, PF 7-9) because
    the deck and bumpers absorb dropped bars.
- id: derived-eqfw-rack-walkout
  title: Half-rack front walk-out clearance
  kind: derived
  notes: 'Every half-rack lift is walked out in front of the uprights, so the front clearance is 48 in
    like the power rack (LF/HS 10 x 10 ft live area) instead of footprint_strength''s 36 in (HS iD +28
    in, LF squat rack +42.5 in live depth): 53 in frame + 48 in + 6 in = 107 in of station depth, inside
    NSCA''s 8-10 ft rack-station depth, where 36 in gives 95 in.'
- id: derived-eqfw-rack-ceiling
  title: Minimum ceiling height for power and half racks (108 in)
  kind: derived
  notes: 'Hammer Strength gives a minimum ceiling height of 102 in for its HD Athletic NX power rack (91
    in tall, with a pull-up bar), and Life Fitness says each HD Athletic NX half-rack upright (86 or 91
    in) can fit in rooms with a standard 8-ft ceiling (both checked 2026-10-29). The racks modelled
    here are 91 in (power) and 93 in (half; Rogue HR-2 92.25 in with a 43-in pull-up bar) tall, so 102
    in is rounded up to the next whole foot, 9 ft (108 in), as the treadmill ceiling is, to leave head
    room for pull-ups on the top bar. The 12 ft the racks used before (NSCA checklist, UFC 4-740-02) is
    a guideline for overhead exercise in general, while the footprint research puts rack, tower and pull-up
    items at about 96-110 in of clear height; 12 ft stays on the items for overhead or airborne work, the
    lifting platform (snatch and jerk), rig bays (kipping and muscle-ups) and wall-ball targets.'
- id: derived-eqfw-landmine-station
  title: Landmine station footprint and contents
  kind: derived
  notes: Footprint = REP free-standing landmine base (18.4 x 13.8 in) plus the 86.75 in Olympic bar lying
    forward from the pivot = 105 x 14 in, keeping footprint_strength's 120 in front zone as bar (87 in)
    + 36 in for the lifter at the bar end, 36 in sides for presses and rows and 6 in behind. Contents
    = base + bar + 160 lb of plates (2 x 45, 2 x 25, 2 x 10 for one-ended presses and rows; an estimate)
    + collars at price_strength tier prices.
- id: derived-eqfw-fixed-barbell-set
  title: 'Fixed barbell set: 20 bars on two 10-bar racks'
  kind: derived
  notes: 'Ten straight and ten EZ fixed bars (20-110 lb, 1,300 lb) need two 10-bar racks: the Life Fitness
    Barbell Rack sells as a 10-bar ($1,659) or 5-bar ($1,040) version, so price_strength''s single-rack
    commercial and premium builds get a second rack. The footprint is two 35 in deep racks side by side,
    each given the LF 60 in live-area width (room to tilt the upright bars out; the frames themselves
    are 28-34.5 in wide) = 35 x 120 in, against a wall.'
- id: derived-eqfw-storage-front-zone
  title: Standing-work zone in front of dumbbell and fixed-barbell racks
  kind: derived
  notes: Front clearance of wall storage that members use standing = NSCA's 4 ft standing-exercise user
    depth ((4 + 6) x 4 ft = 40 sq ft, NSCA 2017 Table D1) + the ISO 20957-1 0.6 m free area = 48 + 24
    = 72 in, which contains the 36 in pick-up depth the LF and HS dumbbell-rack live areas add in front.
    Standing curls, raises, shrugs and RDLs happen there, so the rack carries its standing users' floor
    (about 44 sq ft per 87 in rack); bench-supported dumbbell work is covered by the bench records' own
    clearances.
- id: derived-eqfw-hip-thrust-footprint
  title: Hip thrust bench station footprint (bench plus seated lifter and resting bar)
  kind: derived
  notes: footprint_strength estimated a 24 x 48 in bench with a 48 in front zone for the lifter's torso
    and feet, as an exclusive margin. The layout engine lets front clearances overlap walkways, and the
    loaded bar rests on the floor at the lifter's hips (about 12-24 in in front of the bench) between
    sets, so the 36 in nearest the bench moves into the footprint (24 + 36 = 60 in deep, 87 in wide for
    the 86.75 in bar) and the front clearance becomes the ISO 20957-1 0.6 m free area (24 in) for the
    feet and access. Station depth 12 + 60 + 24 = 96 in, about NSCA's supine-station formula with a 5
    ft bench-plus-lifter length + 3 ft cushion. An estimate, not a published spec.
- id: derived-eqm-footprint-medians
  title: 'Strength machine footprints and heights: medians of published commercial models'
  kind: derived
  notes: 'Length x width = the footprint_strength recommended value for the item: the median length and
    width of the commercial models measured for it (Life Fitness Insignia, Axiom and Signature; Hammer
    Strength; Cybex; BodyKore dealer listings), re-oriented so length runs front-to-back as the user faces
    the unit. Height = median published height of the same models; each record''s notes list its inputs.'
- id: derived-eqm-squat-machine-split
  title: Separate belt squat and pendulum squat footprints
  kind: derived
  notes: 'footprint_strength pooled both machines into one 84 x 54 in value (average of the two archetype
    medians). This dataset uses the archetype medians that research computed: belt squat 72 x 65.5 in
    (HS PL-BSQ 78x63, BodyKore FL1834 66x68) and pendulum squat 97 x 43 in (HS Pendulum-X 97x45, HS V-Squat
    97x42, BodyKore CF8137 83x43).'
- id: derived-eqm-machine-clearances
  title: Clearances for selectorized and plate-loaded machines when clearance zones overlap
  kind: derived
  notes: 'The layout lets neighbours'' clearance zones overlap (gap = the larger facing clearance; selection
    charges half of each), so each side holds the full spacing: 36 in = NSCA''s 3-ft optimum between machines
    and ACSM''s 3-ft buffer (minimum 24 in: NSCA, ISO 20957-1 0.6 m shared free area, Cybex, Star Trac),
    which also covers the 24-in plate-loading strip of HS plate-loaded live areas and charges about 18
    in per side; hip abduction/adduction gets 42 in (live areas add 13-18 in per side of pad travel).
    Backs 24 in (NSCA minimum; Star Trac 24 in ''between and behind machines''); the access side (front;
    back for glute kickback; sides for the leg press) keeps the footprint_strength live-area margin, never
    under 24 in.'
- id: derived-eqm-cable-clearances
  title: Clearances for wall-mounted cable stations
  kind: derived
  notes: 'Front 72 in = NSCA''s 4-ft standing-exercise user space plus the ISO 20957-1 0.6 m free area
    (space research estimate; no manufacturer training area is published and LF''s functional-trainer
    live area is a unit error). Back 0 because the units stand against a wall (NSCA TSAC: tallest equipment
    along walls); sides 24 in shared (NSCA/ISO minimum).'
- id: derived-eqm-price-tiers
  title: 'Machine price per tier: median of new-unit listings, 2026-10-28'
  kind: derived
  notes: 'Machine price per tier = the price_strength typical value: median of the new-unit listings captured
    on 2026-10-28 (e.g. value: Body-Solid, French Fitness, Titan, REP, Bells of Steel, Rogue; commercial:
    LF Axiom, Hoist, Nautilus Instinct/Impact/Leverage, Prime Hybrid/Plate Loaded, Matrix Aura/Versa,
    Rogue; premium: Hammer Strength, LF Insignia, Nautilus Inspiration, Prime Evolution, Matrix Ultra/Magnum,
    Sorinex, Watson, Rogers Athletic), Alaska-dealer prices divided by 1.45, rounded to $50 ($10 below
    $1,000, e.g. T-bar row value $990). Commercial and premium values are mostly list/MSRP (street often
    10-30% lower), while value anchors include sale prices and some home-rated units.'
- id: derived-eqm-combo-price
  title: 'Lat pulldown / low row combo: commercial price from same-line pairs'
  kind: derived
  notes: 'Within one maker''s line the dual pulldown/row costs about what its single lat pulldown does
    (price_strength listings, 2026-10-28): LF Axiom $5,246 and $5,246 (ratio 1.00), Nautilus Instinct
    $3,619 and $3,799 (0.95), Matrix Versa $3,378 and $2,964 after the Alaska divisor (1.14); median
    1.00, and the value line agrees (French Fitness Tahoe $2,799 and $2,799). The commercial tier is
    therefore the single lat pulldown''s $5,050 x 1.00 = $5,050. The plain median of the five commercial
    combo listings ($3,650) is not used because it draws on lighter lines (Rogue LP-2, Nautilus Instinct,
    Matrix Versa) than the single-machine median, which includes Prime Hybrid, Hoist ROC-IT and Nautilus
    Impact; it priced the combo 28% below one single machine while it serves both the pulldown and the
    row. The premium tier keeps its only listing (Hammer Strength HD Elite Dual Pulldown/Row $5,889),
    since no premium line sells both forms.'
- id: derived-eqm-plate-allocation
  title: Plates included with plate-loaded machines
  kind: derived
  notes: 'Estimate (no source states plates per machine): enough plates for a typical working set without
    borrowing, i.e. leg press 500 lb; hack, belt and pendulum squat and hip thrust 300 lb; iso-lateral
    chest press, row and high row 250 lb; iso-lateral shoulder press and T-bar row 200 lb; seated calf
    180 lb. Priced as in the price_strength station builds at $1.90/lb cast iron (value), $3.10/lb urethane-coated
    (commercial; REP Equalizer $3.12/lb) and $5.90/lb Hammer Strength urethane (premium; $5.91/lb) and
    added to the machine price; plate trees are not included.'
- id: derived-eqm-useful-life
  title: Useful life of strength machines and cable stations
  kind: derived
  notes: 8 years = midpoint of Planet Fitness's strength re-equip schedule (years 7-9 in its 2023 and
    2025 investor presentations), inside the 5-9-year franchise re-equip requirement in its FY2025 10-K
    and above the IRS 7-year recovery period for recreation assets (class 79.0); the benchmarks research
    recommends 8 (7-9) years.
- id: derived-eqm-min-ceiling
  title: Minimum ceiling height for tall machines
  kind: derived
  notes: 'Set only where the representative unit is taller than 7 ft: the median published frame height
    of the reference models rounded up to the inch (cable crossover 93, functional trainer 92, cable column
    89, pulldown/row combo 94, multi-station 87 in), or the published live-area height where the user
    rises above the frame (LF Insignia Assist Dip Chin 105 in). Assembly may need a few inches more.'
- id: derived-eqm-multi-station
  title: 'Multi-station gym: station count and one unit per plan'
  kind: derived
  notes: 'stations = 3, the low end of the 3-4 stack range: the 82 x 125 in footprint sits between a 3-station
    (84x105) and a 4-station (80x144) unit, and each stack serves different movements, so counting every
    stack as an interchangeable server would overstate capacity for any one exercise. The planner still
    counts the 3 stations as interchangeable, so a second unit would look like 3 more lat pulldowns or
    chest presses where it adds one stack of each; max_units = 1 keeps that overstatement to a single
    unit, and a plan that needs more capacity buys single-station machines, which serve each movement
    at full quality. Makers sell these frames for light-commercial rooms (Hoist H4400: a 4-station gym
    "for light commercial settings"; Hoist''s light-commercial warranty, as a Hoist dealer lists it,
    covers facilities that charge no membership dues and have at most 50 users a day, such as hotels
    and apartment buildings), not for busy club floors.'
- id: derived-ex-strength-popularity
  title: 'Strength-exercise popularity: consensus share of strength sets mapped to canonical ids'
  kind: derived
  notes: 'Exercises report Sec 5.1 / Table 6.1 ''Cons %'' = 0.5 x StrengthLog 2025 share of logged sets
    (rows outside its top 25 imputed as min(0.99 %, 1.27 x Fitbod share)) + 0.5 x Fitbod ''Sets Logged''
    share over 92 exercise families. Rows map to canonical ids, summing variants that share a station:
    close-grip into bench press, trap-bar into deadlift, EZ into barbell curl, pulldown variants into
    lat pulldown, seated cable + selectorized + plate-loaded rows into machine_row, pushdowns + overhead
    cable extension into triceps_pushdown, chin-up into pull_up.'
- id: derived-ex-extra-fitbod-rows
  title: Consensus-equivalent popularity for Fitbod exercises omitted from Table 6.1
  kind: derived
  notes: 'The Sec 5.1 formula with Table 6.1''s normalisation held fixed (Fitbod total 330,937,675 sets;
    SL-equivalent total 109.71; reproduces all 92 published values exactly), applied to Table 2.2 Fitbod
    counts the report left out: DB Romanian deadlift 4,633,512 sets -> 1.151 %, Dumbbell Squat 3,743,936
    -> 1.017, Crunches 6,413,700 -> 1.420, Plank 4,951,454 -> 1.199, Ab Rollout 1,237,222 -> 0.403, Bench
    Dip 4,217,199 -> 1.088, bodyweight Hip Thrust 4,324,303 -> 1.105, Machine Squat 233,699 -> 0.076.'
- id: derived-ex-family-splits
  title: Per-implement split of composite Fitbod exercise families
  kind: derived
  notes: 'Fitbod component counts follow the report''s row-label order. This was checked on the shrug
    row, whose first component 3,012,522 is Table 2.2''s ''Dumbbell Shrug'', and on the hip thrust, lunge,
    leg press, lateral raise, Smith bench and KB swing rows. Shares used: shrug DB 61.6 % / BB+Smith+machine
    38.4 %; stiff-legged DL BB 18.2 % / DB 81.8 %; step-up bodyweight 48.0 % / DB 34.1 % / BB 18.0 %;
    upright row BB 48.4 % / DB 37.9 % / cable 13.6 %.'
- id: derived-ex-tail-estimates
  title: Popularity estimates for exercises with no app counts
  kind: derived
  notes: Machine hip thrust, inverted row, unloaded walking lunge, standing/single-arm cable row and Pallof/woodchop
    get 0.3 % of strength sets, the level of the least-logged named exercises in Table 6.1 (T-bar row
    0.29, landmine 0.28, standing calf 0.29, Smith squat 0.32). Good morning = trap-bar deadlift (0.128);
    rotary torso = machine reverse fly (0.136); heavy >100 lb DB press = 2 % of DB bench + incline + shoulder
    press (0.108); belt and pendulum squat split Fitbod 'Machine Squat' (0.076) equally. Functional items
    with no counts (KB complexes, farmer's carry, heavy bag, rig circuits) = 0.133, the median measured
    functional item.
- id: derived-ex-functional-popularity
  title: Functional-modality popularity
  kind: derived
  notes: 'Same consensus-share units as strength: KB swing 0.615, box jump 0.133 + bodyweight step-ups
    0.477, TRX 0.407, wall ball/slam 0.133, sled 0.083, battle ropes 0.076 (Table 6.1); unmeasured items
    0.133. Fitbod under-represents gym-only functional kit (sled = 0.08 % of sets), so turf, rig and bag
    items are likely lower bounds that functional-focused profiles should raise with exercise multipliers.'
- id: derived-ex-cardio-popularity
  title: Cardio popularity converted from share of cardio minutes
  kind: derived
  notes: 'Popularity = usage report Sec 0.2 average cardio-minutes mix / bout minutes (bouts per 100 cardio
    minutes), so popularity x block_minutes reproduces the mix: treadmill 40, curved treadmill 1, elliptical
    15, upright 11, recumbent 8, indoor cycle (free use) 3, air bike 2, rower 7, stair 10, SkiErg 1, recumbent
    stepper 2. That mix starts from SFIA 2023 cardio occasions (treadmill 40.8 %, bikes 25.5 %, elliptical
    19.1 %, rower 6.2 %, stair 6.1 %, group cycle 2.4 %).'
- id: derived-ex-treadmill-split
  title: Treadmill minutes split into running, incline walking and walking
  kind: derived
  notes: No source splits treadmill time, so it is split in equal thirds (walking 2/3, running 1/3; estimate).
    This sits between SFIA 2023 all-venue occasions (walking for fitness 13.9 B vs running/jogging 3.2
    B, 81 % walking) and an even walk/run split. Fitbod 2022 reports 'Treadmill Walking' as the 2nd most
    manually added exercise.
- id: derived-ex-cardio-bout-minutes
  title: Cardio bout minutes
  kind: derived
  notes: 'Exercises report Sec 5.5 typical bouts, anchored on ACSM 2011 (>=30 min/day moderate, >=20 vigorous),
    Girginer & Sahin''s simulated ~21-22 min per machine with a 20-min console default, and 30-min posted
    caps: elliptical and bikes 25, stair 18, rower 15, curved treadmill 15, air bike 11, SkiErg 10, stepper
    25. Treadmill 27 is split into running 22 and walking 30 so its bout-weighted mean stays 27. Indoor
    cycle uses the free-use bike value 25 because classes (45) fall outside floor time.'
- id: derived-ex-block-minutes
  title: Station hold time per strength / functional exercise bout
  kind: derived
  notes: 'Exercises report Sec 5.2 (setup + warm-up sets x cycle + 3 working sets x set time + 2 rests):
    heavy barbell 2.0+2x1.5+3x0.6+2x2.5 = 11.8; loaded accessory 9.3; machine compound 8.0; DB/KB compound
    7.1; isolation 4.6; bodyweight 4.7; functional 4.75. Inputs are ACSM 2009/2026 sets and rests, Grgic
    2018, Ibbott 2019, Singer 2024 and Silva 2018. Sled push/pull (8) and heavy bag (12) use the occupancy
    report Sec 3.5 per-use holds.'
- id: derived-ex-mobility
  title: Mobility popularity and block minutes
  kind: derived
  notes: 'Stretching is weighted by member reach (IHRSA 2016: 24 % of members stretch). Foam rolling 12,
    band/ball work 6 and solo yoga/mobility flows 6 are estimates with no usage counts (HFA 2024 yoga
    reach of 21.8 % is mostly class-based). Blocks: stretching 10 min (occupancy report stretch-area hold
    5-15); foam rolling and bands 5 (5-min warm-up / cool-down, usage report Sec 3.3); yoga flow 15.'
- id: derived-ex-route-quality
  title: Route quality rubric for exercise options
  kind: derived
  notes: 'Quality is a route''s fit relative to the canonical setup; the engine also uses it as the chance
    a member accepts that route as a fallback. 1.0 = canonical setup; 0.85-0.95 = near-equivalent setup
    for the same lift (bench in a power rack + bench 0.95, half rack 0.9); 0.6-0.8 = same movement on
    another implement (machine chest press for barbell bench 0.6, cable column for lat pulldown 0.8),
    ordered within the band by Fitbod swap counts (exercises report Table 7.2); 0.3-0.5 = same muscle,
    different movement, matching the report''s Sec 7 acceptance guide (routes below 0.3 omitted). On the
    5-50 lb dumbbell set, isolation lifts score 1.0 and compound lifts 0.6-0.85 by the estimated share
    of users working under 50 lb (GYMetrix: 8-18 kg dumbbells are the most used). The 5-100 lb set contains
    every 5-50 lb dumbbell, so every route on the light set has a matching route on the full set (same
    other equipment) at equal or higher quality. Cardio fallbacks score 0.85-0.9 for a near-identical
    machine, 0.6-0.8 for the same movement or posture on a different machine (a curved manual treadmill
    for a steady run 0.7), and 0.3-0.55 for other cardio.'
- id: derived-beh-floor-minutes
  title: Mean active floor time per visit (55 min)
  kind: derived
  notes: Boostcamp's median logged lifting session is 58 min, Strava's average strength session just over
    50 min and Pinero et al.'s 4-exercise lab session 55.3 min; door-to-door visits of 68-69 min (PureGym
    gate data) and 72-74 min (Placer.ai) include changing time. The usage and occupancy research both
    settle on 55 min.
- id: derived-beh-floor-cv
  title: Spread of floor time per visit (cv 0.45)
  kind: derived
  notes: 'A lognormal through Boostcamp''s median 58 min and 75th percentile 79 min has sigma = ln(79/58)/0.674
    = 0.46, so cv = sqrt(exp(sigma^2) - 1) = 0.48 (0.52 from the 90th percentile of 109 min, which sessions
    left running inflate). Fixed-protocol lab sessions set a floor of 0.23-0.27 (Pinero et al.: 55.3 +/-
    12.6 and 70.5 +/- 19.1 min); 0.45 is adopted.'
- id: derived-beh-idle-share
  title: Share of floor time spent between stations (0.21)
  kind: derived
  notes: 'Strength: 6 exercises x a 7.1-min mean station hold (exercises research) = 42.5 min of a 58-min
    Boostcamp session, leaving 15.5 min idle, or 0.365 idle min per active min. Cardio: about 2 min of
    transition per 25-min bout (ACSM''s 20-30 min per day; 20-min console default in Girginer and Sahin),
    or 0.08 per active min, an estimate. Weighted by the general profile''s 35% cardio time, 0.35 x 0.08
    + 0.65 x 0.365 = 0.265 idle per active min, so 0.265 / 1.265 = 0.21 of floor time (0.19-0.24 for the
    other profiles).'
- id: derived-beh-weekday-visit-rate
  title: Visits per member on an average weekday (0.20)
  kind: derived
  notes: 'Seven-day average of 0.17 visits per member per day (The Gym Group 2023 at least 0.188, PureGym
    2019 0.171; HFA''s 75 attendance days a year is 0.205) x a 1.18 weekday uplift: weekdays carry 17.3-17.5%
    of weekly visits rather than 14.3% (Federation University 1.21, Itensity 1.23, Planet Fitness Mon-Wed
    1.22, discounted toward the fact-checker''s 1.15-1.2). The peak share and busy-day factor are measured
    on weekdays, so the visit rate must be a weekday rate too.'
- id: derived-beh-design-peak-share
  title: Share of members on the floor at the design peak (2.75%)
  kind: derived
  notes: '0.20 weekday visits x 11% of the day''s visits on the floor in the busiest hour (BLS: 20.5%
    of the day''s exercisers active in the weekday 6 pm hour x D/(D+1) with D = 1.28 h gives 11.5%; Federation
    University peak-hour arrivals 11.3-11.9%) x 1.25 busy-day factor (90th percentile over mean daily
    peak-hour occupancy, 1.26 and 1.23 in the two campus-gym years) = 2.75% of members. This sits inside
    the fact-checker''s corrected 2.7-2.9% and just under UK planning practice (1.5 visits a week x 65%
    in 34 peak hours = 2.87%).'
- id: derived-beh-floor-density
  title: Comfortable design density (10 users per 1,000 sq ft of training floor)
  kind: derived
  notes: 100 sq ft of training floor per user is about 1.4x Les Mills' 6-7 m2 (65-75 sq ft) gym-floor
    minimum. At the corrected design peak, UK budget clubs run about 9-18 users per 1,000 sq ft of training
    floor (about 130 users in a 12,000-15,000 sq ft PureGym-like box; 115 for an average Gym Group membership
    on a 16,285 sq ft site like Coventry; 0.62-0.75 training-floor share), at or past that minimum. The
    campus weight-room counts (110 sq ft per person at an average day's peak) are corroboration only,
    because the counted space is unverified.
- id: derived-beh-bodyweight-carveout
  title: Carving the bodyweight modality out of the research time buckets
  kind: derived
  notes: 'The usage research has no bodyweight bucket, so bodyweight time is taken from where it was counted:
    4.5% of each strength bucket (pull-ups, chin-ups, dips, hanging raises, push-ups, back extensions
    and glute-ham raises are 4.5% of strength station-time in the exercises research''s consensus table);
    21% of the functional bucket (built with about a third of SFIA''s bodyweight occasions, about 31%
    of its basis, two-thirds of which is schema bodyweight work); and a sixth of the stretch and core-mat
    bucket (floor core). For the average member this gives 4.9% of floor time, about 9% of strength-type
    time, between the app-log consensus (4.5% of strength station-time) and Boostcamp beginners (6.4-14.7%
    of logged exercises).'
- id: derived-beh-cardio-mix-multipliers
  title: Cardio exercise multipliers from the profile cardio mixes
  kind: derived
  notes: Each multiplier is the profile's share of cardio minutes on that machine in the usage research
    divided by the average member's share (treadmill 40, elliptical 15, upright bike 11, recumbent bike
    8, indoor cycle 3, air bike 2, rower 7, stair climber 10, ski erg 1, curved treadmill 1 and seated
    stepper 2 percent), rounded to 0.05 and clipped to 0.4-2.5; ratios within 15% of 1 stay at 1 and 0
    is used only where the profile excludes the machine. The functional profile's rowers, air bikes, curved
    treadmills and ski ergs keep their full ratios (25/7 = 3.55, 25/2 = 12.5, 15/1 = 15, 20/1 = 20), because
    they are most of that format's cardio fleet, and clipping them at 2.5 would leave its cardio time
    about 39% on treadmills and 4% on ski ergs against the research's 15% and 20%. That profile also keeps
    treadmill running at 1 and cuts treadmill walking to 0.4 because HYROX is 8 x 1 km of running, so
    treadmills end up with about 20% of its cardio time.
- id: derived-beh-profile-density
  title: Profile training densities scaled by the area each time mix needs
  kind: derived
  notes: 'The 10-per-1,000 sq ft target is scaled by the floor area per user each profile''s time mix
    needs relative to the average member''s: Les Mills'' 5 m2 per cardio user, 10 m2 per CrossFit-style
    user and 6-7 m2 per gym-floor user, with barbell stations about 1.6x other strength stations (NSCA
    130-144 sq ft per rack or platform against 90 per bench). This gives strength 9.2, cardio/wellness
    10.9 and functional 8.1 per 1,000 sq ft, rounded to 9, 11 and 8; functional sits between Glofox''s
    150-200 sq ft per CrossFit participant and Les Mills'' 108 sq ft read directly. Class-based group
    training runs denser (PushPress 60-80 sq ft per concurrent member), so 8 suits an open functional
    floor, not a class studio.'
- id: derived-beh-wellness-multipliers
  title: Cardio/wellness pull-up and dip multipliers
  kind: derived
  notes: Pull-ups and dips are set to 0.6 because the pull-up/chin-up station is the second most intimidating
    gym area after the squat rack (PureGym survey), pull-ups are outside women's top-25 StrengthLog exercises
    while making up 2.0% of men's sets, and the preferences research rates the dip/chin station well below
    average for older and beginner members (estimated tilts 0.5-0.7). The value is a judgment estimate.
- id: derived-beh-functional-multipliers
  title: Functional-format exercise multipliers
  kind: derived
  notes: 'Judgment estimates anchored on the HYROX race stations and Orangetheory''s class format: wall
    balls, farmers carry and walking lunges 2.0 (one station each); sled push and pull 3.8 because they
    are two of the eight stations, which gives the sled twice the floor time of one station (popularity
    x multiplier x block minutes: 0.083 x 3.8 x 8.0 = 2.52 against 0.133 x 2.0 x 4.75 = 1.26 for wall
    balls or the carry; the earlier 2.5 gave the two sled stations only 1.3 stations'' worth); push-ups
    1.5 as the burpee proxy; Olympic lifts 2.0 (PushPress''s group-training kit
    is a rig or racks plus 6-8 sets of bumper plates); bench-press variants and heavy bags 0.5 (absent
    from these formats). No measured usage supports the exact values.'
- id: derived-beh-amenity-shares
  title: Amenity-room time split (estimate)
  kind: derived
  notes: No usage data exist for hotel, apartment or office fitness rooms. Cardio is set at 45% (between
    the average member's 35% and cardio/wellness 47%) and stretching at 7%; the other 48% follows SFIA's
    all-venue strength occasions (dumbbells 36.9%, machines 19.3%, barbells 19.3%, bodyweight 16.6%, kettlebells
    7.9%; home use included, which suits room-scale gyms), with two-thirds of barbell time moved to dumbbells
    and 40% of machine time to a cable or functional trainer.
- id: derived-beh-amenity-density
  title: Amenity-room training density (5 users per 1,000 sq ft, estimate)
  kind: derived
  notes: 'Nearest measured format: Anytime Fitness small 24/7 clubs average 660 members (2026 FDD Item
    19; quartiles 411-995) on 4,000-7,000 sq ft (Item 7). At 2.75% of members on the floor at the design
    peak that is about 18 people on roughly 3,850 sq ft of training floor (70% of 5,500 sq ft), or 4.7
    per 1,000 sq ft (2.9-7.1 across the quartiles). Hotel, apartment and office rooms themselves were
    not measured.'
- id: derived-beh-format-exclusions
  title: Equipment excluded by format, with matching zero exercise multipliers
  kind: derived
  notes: 'Exclusions remove items a format would not buy: advanced-lifter items (GHD, belt and pendulum
    squats, 105-150 lb dumbbells) and CrossFit- and HYROX-style conditioning kit (rig bays, wall-ball targets,
    battle ropes; SFIA: US cross-training participation fell 31% in 2019-23) from cardio/wellness floors;
    multi-station gyms, which makers sell for light-commercial rooms (Hoist H4400), from strength floors;
    ellipticals, recumbent bikes and seated steppers (zero share of the functional cardio mix) from functional
    floors; and items needing large or specialist space from amenity rooms (NSCA: 144 sq ft per platform
    and 12-ft ceilings for overhead lifting, which rig bays and wall-ball targets also need; Torque: 10-yd
    minimum sled run; a battle-rope lane about 22 ft long for a 40-ft rope). Exercises built around an
    excluded item get a 0 multiplier: that format''s members do not program them, so their time goes to
    the rest of the modality instead of to poor substitute routes (for example Olympic lifts in a power
    rack, or rig circuits on a dip and chin-up station), which most of them still have in the exercises
    data. No exercise is built around the multi-station gym, so its exclusion needs no multiplier.'
- id: derived-sp-aisle-widths
  title: Aisle widths used by the floor layout
  kind: derived
  notes: Main aisle 60 in = ADA 403.5.3 / 304.3 passing and turning width (no 60 x 60 in passing spaces
    needed) and NSCA TSAC 60-in hallways. Secondary aisle 36 in = ADA 403.5.1 accessible-route minimum
    and NSCA 36-in passageways, chosen over the 48 in typical (Skelcore, Rush Walter) because clearance
    zones may overlap walkways (DOJ 2010 guidance on 236/1004).
- id: derived-sp-circulation-share
  title: Circulation share of the training floor
  kind: derived
  notes: 'Midpoint (0.175) of the space report''s 15-20% of training floor for aisles on top of per-unit
    clearances. Geometric checks: a 6-ft spine plus two 4-ft cross aisles on a 60 x 100 ft floor is about
    17%; one 4-ft aisle plus an entry and turn area on a 30 x 50 ft floor is 17-20%. UFC 4-740-02 uses
    a building-level net-to-gross factor of 0.20.'
- id: derived-sp-packing-efficiency
  title: Initial packing efficiency for equipment selection
  kind: derived
  notes: 0.65, calibrated against the layout engine and checked against Planet Fitness density. Geometry
    alone gives an upper bound of about 0.78 = 1 - 0.175 aisles (derived-sp-circulation-share) - 0.05
    for row ends and wall-facing clearance halves (effective unit area = footprint + half of each clearance).
    With the row and wall-lined layouts, the fit loop and the most-wanted rule as of 2026-10-28, the planner
    was run on the five sample scenarios and 15 more requests (600-40,000 sq ft of training floor, every
    gym focus, two tight budgets and a 124 x 18 ft storefront) at starting values of 0.55-0.7. Mean
    quality-weighted demand served was 0.662 at 0.55, 0.664 at 0.6 and 0.665 at 0.65 and 0.7 (sample
    scenarios 0.763, 0.769 and 0.770); between 0.55 and 0.65 unplaced budget fell from $57,000 to $32,000
    in total and layout passes rose only from 34 to 36, while 0.7 needed 48. In the final plans the placed
    units claim 0.37 of the training floor at 750 sq ft, 0.48 at 1,200, 0.56 at 3,750 and 0.63-0.65 at
    7,000-12,500 (rechecked 2026-10-29 after the format and ceiling updates). Planet Fitness's 116-152
    sq ft of building per piece is 64-94 sq ft of training floor at a 0.55-0.62 training share; the planned
    pieces average about 48 sq ft of effective area in a big-box plan, so its density implies 0.51-0.74.
    The 12,500 sq ft big box holds 154 pieces, 12.3 per 1,000 sq ft of training floor (Planet Fitness's
    6.6-8.6 per 1,000 sq ft of building is 10.6-13.9 at the large
    band's 0.62 training share). Sport England's 5 m2 (54 sq ft) per piece, excluding the room's general
    circulation, implies about 0.73 (48 / 54 x 0.825), near the top of that range. Recalibrate when the
    equipment footprints or the layout engine change.
- id: derived-bm-training-share
  title: Training-floor share of a gym building, to compare real gyms with plans
  kind: derived
  notes: 'Real gyms'' sizes, equipment spend and piece densities are given per sq ft of building, while
    the planner is given only the training floor. The training share restates them: 1 - the share for
    reception, locker rooms, restrooms, offices, storage and walls, from the space report section 5.3.
    Micro (<= 2,500 sq ft) 0.80: two ADA single-user restrooms (~64 sq ft each) + desk/office 120 + storage
    80 = ~330 sq ft, 13-22% of 1,500-2,500 sq ft. Small (2,500-10,000) 0.70: adds showers and small locker
    areas (vendor guides 10-25% amenities: Dynamo, Rework, Glofox). Mid (10,000-25,000) 0.62: lockers
    15 + reception 5 + offices 3 + storage 5 + walls/MEP 10 percent. Large (> 25,000) 0.55: adds studios
    and amenities (the amenity-heavy
    UFC Army program keeps only 30-39%). Each validation band takes the figure of the size class that
    holds its typical gym, as the report gives it: 0.80 for the small band (typical 2,500 sq ft, the micro
    class''s upper cut), 0.70 for the medium band (5,500 sq ft; its piece density was built at 0.70, see
    derived-sp-band-medium) and 0.62 for the large band (20,000 sq ft; space.yaml also uses 0.55-0.62
    for Planet Fitness, the band''s main source). An earlier version interpolated between the class cuts
    and gave 0.74 and 0.64, which restated the medium band at a share it was not built with. Low confidence:
    no primary source gives commercial support-space
    ratios, so these rest on a military design program (UFC 4-740-02), ADA restroom sizes and vendor guides,
    and the report''s ranges overlap (micro 0.75-0.85, small 0.60-0.80, mid 0.55-0.70, large 0.45-0.65).'
- id: derived-sp-zone-plan
  title: Zone order and flooring by zone
  kind: derived
  notes: 'Cardio nearest the entrance and machines next, on 8 mm glued rubber (UFC 4-740-02: resilient
    athletic flooring for cardio and selectorized areas; Greatmats: 3/8 in for loads up to 120 lb). Free
    weights toward the back on 12 mm rubber (Greatmats: 1/2 in for barbells over 120 lb; UFC: adhered
    impact rubber; NSCA: dumbbell racks and the tallest equipment along walls, platforms away from exits
    and busy areas). Functional zone on turf and rubber for sled lanes and rigs. Stretching at the back
    on 8 mm rubber with mats, 50 sq ft per user (UFC).'
- id: derived-sp-default-ceiling
  title: Default clear ceiling height
  kind: derived
  notes: 144 in (12 ft) = NSCA minimum for overhead exercise (checklist 12 ft; TSAC 12-14 ft) and the
    UFC 4-740-02 fitness-area minimum (12 ft, 14 ft preferred); 3.66 m is inside Sport England's optimum
    of 3.5-4 m (not below 2.7 m). A guideline value for a fitted-out gym, not a survey of building heights.
    Rooms under 12 ft exclude rigs, wall balls and lifting platforms, the items for overhead work; racks,
    treadmills and stair climbers need 9 ft (derived-eqfw-rack-ceiling, derived-eqcf-treadmill-ceiling,
    and the LF PowerMill's 9 ft).
- id: derived-sp-flooring-installed
  title: Installed flooring cost per sq ft by flooring type (2026 USD)
  kind: derived
  notes: 'Material price plus professional installation of $1.50-3 per sq ft (DG Floors). 8 mm: $2.21-6
    material gives $3.7-9, typical $5.5 (3/8 in roll about $4 + $1.50). 12 mm: $4.13-10 gives $5.6-13,
    typical $7.5 (1/2 in roll about $5.50 + $2; DG turnkey $7-11). 19 mm: heavy mats $5-8 and an 18 mm
    tile at $7.96, mostly loose-laid, gives $5.5-11, typical $8.5. Turf: $1.26-6.71 listings and $4-7
    strips gives $2.5-9, typical $6.'
- id: derived-sp-refurbished-multiplier
  title: Refurbished price as a share of the new commercial-tier price
  kind: derived
  notes: '0.6 x commercial tier. Cardio: 21 remanufactured-vs-new pairs, median discount 62% (54% for
    the 6 still in stock), recommended 50% off for branded cardio and 40% for simple machines. Strength:
    remanufactured units sell for about 0.50 x new premium list (15 pairs); CTX and Fitness Superstore
    selectorized medians of $2,495 and $3,999 against a new commercial chest press of about $5,050 are
    0.49-0.79 (about 0.65). Assuming 35-50% of the spend goes to cardio (~0.5), 40-50% to machines and
    racks (~0.65) and 10-15% to free weights and functional gear (no refurbished discount), the blend
    is 0.61-0.65. It is rounded to 0.6 because the in-stock cardio pairs have a median discount of 54%,
    a little deeper than the 50% assumed (the fact-check confirmed the 50% against that median and against
    Club Solutions'' dealer quotes of 30-50% and 40-70% off). The spend weights are assumptions. One multiplier
    covers every item, including free weights that sell at full price.'
- id: derived-sp-installation-rate
  title: Freight, delivery and installation as a share of equipment cost
  kind: derived
  notes: '12% (range 8-20%), as corrected by the price fact-check: NTAI says installation and shipping
    commonly add 12-20% and installation alone 8-15%; Hoist''s white-glove install add-ons are a median
    10.2% of list (install only, no freight); Fitness Exchange local delivery and assembly is 5-12% for
    $3k-10k cardio; Concept2 parcel shipping is 5.6-7.4%; iSellFitness charges $299-600 per installed
    machine.'
- id: derived-sp-benchmark-typicals
  title: Typical values for benchmark ranges
  kind: derived
  notes: Where a source gives only a low-high range, typical = midpoint (e.g. Planet Fitness 2026 FDD
    equipment $333,000-995,000 gives $664,000; Anytime Fitness 4,000-7,000 sq ft gives 5,500). A typical
    stated by the source is used as is (Planet Fitness "typically 20,000 square feet"). Members per club
    = system members / clubs (Planet Fitness 20.8M / 2,896; The Gym Group 945k / 260). Gold's Gym equipment
    = strength line + cardio line. $ per sq ft = equipment / sq ft at the midpoints.
- id: derived-sp-pf-openings
  title: Planet Fitness 2024-26 opening piece counts
  kind: derived
  notes: 'Five opening announcements, 13,605-21,141 sq ft: Worcester 117 pieces (48 cardio / 69 strength),
    Lakewood 152 (62/90), Eden Prairie 155 (62/93), Puyallup 139 (56/83), Sammamish 139 (56/83). Median
    139 (56/83); 6.6-8.6 pieces per 1,000 sq ft (mean 7.8); cardio 40.0-41.0% of pieces.'
- id: derived-sp-band-small
  title: Validation band for small gyms and studios
  kind: derived
  notes: 'Equipment $/sq ft = FDD equipment line / studio size: Orangetheory 31.6-60.8 (mid 43.8), Class
    by UFC GYM 31.4-59.1 (mid 42.1), F45 46-72; typical 45, high 75. Low 18 = Atlantis Strength''s CAD
    25/sq ft at about 0.72 USD per CAD, per the fact-check. Pieces 12-17 per 1,000 sq ft (Atlantis: 25-35
    pieces per 2,000 sq ft; Orangetheory about 13 stations per 1,000). Cardio share 0.20 (strength studio)
    / 0.40 (general mix, as in budget clubs) / 0.67 (Orangetheory: treadmills and rowers are two of three
    station types).'
- id: derived-sp-band-medium
  title: Validation band for medium gyms
  kind: derived
  notes: '$/sq ft from Anytime Fitness (20.0-39.5, mid 27.1) and Snap Fitness (33.3-62.5, mid 45): 20-60,
    typical 35. Pieces per 1,000 gross sq ft (no direct counts): space allowances of 40-60 sq ft per piece
    (ACSM 4th ed.), 50-65 per station (UFC) and 5 m2 per piece (Sport England) give about 11-17 at a 0.70
    training-floor share; Planet Fitness''s 116-152 gross sq ft per piece at a 0.55-0.62 training share
    (space.yaml gives 0.62 at 15,000-25,000 sq ft) is 11-16 pieces per 1,000 sq ft of training floor,
    or 7-11 at 0.70. Band 8-15, typical 11. Cardio share 0.20-0.45, typical 0.40 (budget clubs 35-45%,
    strength-focused 20-30%).'
- id: derived-sp-band-large
  title: Validation band for large clubs
  kind: derived
  notes: '$/sq ft from 2026 FDD equipment lines / premises: Planet Fitness 13.3-66.3 (mid 33.2), Crunch
    21.3-75.0 (mid 39.2), Gold''s Gym 23.4-75.0 (mid 42.8): 20-75, typical 38. Pieces: Planet Fitness
    2024-26 openings 6.6-8.6 (mean 7.8, typical 8); PureGym 220+ pieces / 15,000-20,000 sq ft = 11-15,
    of which the low end, 11, is the high. Cardio share: Planet Fitness 40-41% (typical 0.40); strength-focused
    20-30% (low 0.20); budget clubs up to 45% (high 0.45); the older Duluth layout''s 59.5% is left outside
    the band.'
- id: derived-sp-scenario-budgets
  title: Sample scenario budgets
  kind: derived
  notes: 'Each sample is the training floor of a typical gym of its kind: 800, 1,500, 5,000-5,500, 10,000
    and 20,000 sq ft buildings, times their training share (0.95 for an amenity room inside a host building,
    otherwise derived-bm-training-share: 0.80, 0.70, 0.70 and 0.62), give 760, 1,200, 3,500-3,850, 7,000
    and 12,400 sq ft, used as 750, 1,200, 3,750, 7,000 and 12,500 (the 24/7 range runs from the Snap
    Fitness to the Anytime Fitness typical club). Budget = equipment $ per sq ft of building x building
    area + flooring. Equipment rates come from the benchmark validation bands: amenity room $40 (cardio-heavy
    room; small band $18-75, typical $45), studio $35, 24/7 gym $35 on a 5,000 sq ft club (medium typical),
    strength club $40 (between the medium typical of $35 and Gold''s Gym''s $43), big box $38 (large typical);
    per sq ft of training floor that is $42, $44, $46, $57 and $61, against restated typicals of $50 (medium)
    and $61 (large). Flooring = training floor x blended zone rate of $6.06-6.33 per sq ft (behavior.yaml
    profiles). Rounded to $1,000-5,000.'

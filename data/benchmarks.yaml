benchmarks:
- id: planet_fitness
  name: Planet Fitness
  format: HVLP big box (US franchise)
  sqft:
    low: 15000
    typical: 20000
    high: 25000
  equipment_budget_usd:
    low: 333000
    typical: 664000
    high: 995000
  members:
    low: 7182
    typical: 7182
    high: 7182
  equipment_counts:
    total_pieces: 139
    cardio_pieces: 56
    strength_pieces: 83
  notes: '2026 FDD Item 7: equipment bought outright costs $333,000-995,000 (financed: $33,300-298,500
    down) for premises of about 15,000-25,000 sq ft; the FY2025 10-K says clubs are typically 20,000 sq
    ft. The $333,000 floor appears in one FDD reproduction (VetMyFranchise) only. Equipment about $33
    per sq ft at the midpoints. Members: 20.8 million across 2,896 clubs (system average). Piece counts
    are the median of five 2024-26 openings (117-155 pieces, 6.6-8.6 per 1,000 sq ft, 40-41% cardio) after
    the 2024-25 shift to more strength equipment; the median is also the layout Puyallup and Sammamish
    both used. Clubs are re-equipped every 5-9 years.'
  sources:
  - vetmyfranchise-planet-fitness-franchise-2026
  - franchise-chatter-planet-fitness-review-2026

    typical: 13
    high: 17
  cardio_share_of_pieces:
    low: 0.2
    typical: 0.4
    high: 0.67
  training_share: 0.8
  notes: 'Per gross sq ft. Most small-gym data come from franchised class studios (Orangetheory, F45,
    Class by UFC GYM), whose packages bundle technology and installation and whose demand is set by class
    schedules, so open-floor plans may sit nearer the low end. The $18 floor is a vendor guide''s CAD
    25 per sq ft converted to USD (fact-check correction). Cardio share depends on format: about two-thirds
    of Orangetheory stations, about 40% for a general mix, nearer 20% for a strength studio. Below 1,000
    sq ft there is no band; the same vendor guide puts rooms up to 1,000 sq ft at about USD 18-36 per
    sq ft.'

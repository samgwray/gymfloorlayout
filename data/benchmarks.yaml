    high: 40000
  equipment_budget_usd:
    low: 850000
    typical: 1175000
    high: 1500000
  members:
    low: 7484
    typical: 7949
    high: 8303
  notes: '2026 FDD Item 7 line "fitness equipment, fixtures, other fixed assets" $850,000-1,500,000 (one
    FDD reproduction; the 2025 FDD line was $150,000-1,000,000). Locations are 20,000-40,000 sq ft with
    a sweet spot of 25,000-30,000. Item 19 (FY2024, 143 clubs open 12-60 months): average members by cohort
    7,484-8,303, about 7,949 club-weighted on about 32,173 sq ft (0.25 members per sq ft). Equipment about
    $39 per sq ft at the midpoints.'

  excluded_equipment:
  - ghd
  - belt_squat
  - pendulum_squat
  - dumbbell_heavy_extension
  - rig_bay
  - wall_ball_station
  - battle_rope_station
  rationale: 'Cardio/wellness vector from the usage research for community, hospital-based and classic
    budget floors with older or female-skewed members: after the SFIA trend shift, ATUS time use puts
    strength at about 42% of strength-plus-cardio minutes for people 55+ and for women, Boomers rank stretching
    and cardio equipment above free weights (ABC Fitness), and IHRSA finds older members prefer stationary
    cycling, stretching and resistance machines. Cardio multipliers follow the research''s cardio/wellness
    mix (recumbent bikes 1.5x, seated steppers 2.5x, ellipticals 1.35x; stair climbers, rowers and interval
    ergs down), consistent with ACSM ranking programs for older adults #2 for 2026, and pull-ups and dips
    drop to 0.6x because the pull-up station is the second most intimidating gym area (PureGym) and women
    log far fewer pull-ups than men (StrengthLog). GHDs, belt and pendulum squats and 105-150 lb dumbbells
    are advanced-lifter items excluded from this format, and so are rigs, wall-ball targets and battle
    ropes, the CrossFit- and HYROX-style conditioning kit of a functional floor (US cross-training participation
    fell 31% in 2019-23; rigs and wall-ball targets also need 12-ft ceilings). Their exercises get a zero
    multiplier, while pull-ups and hanging raises keep the dip and chin-up station. Density is 11 per
    1,000 sq ft because a cardio user needs about 5 m2 against 6-7 m2 on a general gym floor (Les Mills).'

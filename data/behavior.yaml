  notes: 'Design peak = members x 0.20 visits per member on a weekday (the 0.17 seven-day average x 1.18
    weekday uplift) x 11% of that day''s visits on the floor in the busiest hour x 1.25 busy-day factor
    = 2.75% of members. That matches the fact-checker''s correction of the occupancy research (2.7-2.9%;
    the research''s 2.4% mixed a seven-day visit rate with weekday peak shares) and UK planning practice
    (2.87-2.92% per peak hour). The floor density of 10 users per 1,000 sq ft (100 sq ft each) is a comfort
    target about 1.4x Les Mills'' 65-75 sq ft gym-floor minimum; budget clubs reach roughly 9-18 per 1,000
    sq ft at their design peak. Do not stack the 1.3 January or semester-start surge on the busy-day factor
    (the 90th-percentile days already include those surges), and apply no within-hour factor, because
    the Erlang model already captures short peaks. 50 gross sq ft per occupant is the IBC Table 1004.5
    factor for exercise rooms (the NFPA 101-based Florida fire code uses 50 with equipment and 15 without):
    a life-safety ceiling, not a comfort level.'

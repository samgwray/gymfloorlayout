- id: general
  name: General fitness
  description: 'A typical mainstream gym: a large cardio area plus a balanced mix of dumbbells, machines,
    racks and cable stations for the average member.'
  modality_share:
    cardio: 0.35
    barbell: 0.11
    dumbbell: 0.167
    machine: 0.162
    cable: 0.057
    bodyweight: 0.049
    functional: 0.055
    mobility: 0.05
  exercise_multipliers: {}
  excluded_equipment: []
  rationale: 'Average-member split from the usage research (cardio 35%, barbell 11.5%, dumbbells 17.5%,
    machines 17%, cables 6%, functional 7%, stretch and core mats 6%), built from ATUS minutes per activity
    shifted by the SFIA 2019-23 strength trend and app-logged exercise mixes; the cardio share is uncertain
    by about 4 points either way (the fact-checker suggests testing 30-38%). Bodyweight work had no bucket
    of its own, so it is carved out where it was counted: 4.5% of each strength bucket (pull-ups, dips,
    hanging raises, push-ups and back extensions are 4.5% of strength station-time in the exercises research),
    about a fifth of the functional bucket (built partly from SFIA bodyweight occasions) and a sixth of
    the mat bucket for floor core. Trend signals in the preferences research (free weights the fastest-growing
    category, ellipticals and selectorized machines losing members, treadmills steady) are already in
    this 2025-26 estimate, so no extra multipliers apply.'

  rationale: Functional vector from the usage research, built from the HYROX race (8 x 1 km runs plus
    SkiErg, sled push and pull, burpee broad jumps, rowing, farmers carry, sandbag lunges and 100 wall
    balls) and Orangetheory's treadmill, rower and floor class; no measured usage stands behind it, so
    it is low confidence. Cardio multipliers reproduce that research's functional cardio mix (treadmills
    15%, curved treadmills 15%, air bikes 25%, rowers 25%, ski ergs 20%; PushPress's group-training kit
    is 4 rowers and 2 air bikes), which takes large ratios because these machines get only 1-7% of the
    average member's cardio time (rowers 3.55x, air bikes 12.5x, curved treadmills 15x, ski ergs 20x),
    while treadmill running stays at 1x for HYROX's 8 x 1 km and treadmill walking, bikes and stair climbers
    drop to 0.4x. Other multipliers raise the HYROX stations and Olympic lifting (sleds 3.8x, which gives
    sled push and sled pull, two of the eight stations, twice the floor time of the wall-ball or carry
    station; wall balls, carries, walking lunges and Olympic lifts 2x; push-ups as the burpee proxy 1.5x)
    and lower bench-press variants and heavy bags to 0.5x, in line with HYROX's growth to 5,000 training
    clubs and new budget-gym builds adding sled tracks while US cross-training participation fell 31%
    in 2019-23. Ellipticals,
    recumbent bikes and seated steppers have no share in this format and are excluded with zero multipliers,
    and density is 8 per 1,000 sq ft because CrossFit-style training needs about 10 m2 per person against
    6-7 m2 on a general gym floor (Les Mills; Glofox gives 150-200 sq ft).

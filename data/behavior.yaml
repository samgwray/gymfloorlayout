  rationale: 'Estimate: hotel, apartment and office fitness rooms have no published usage data, so they
    are modeled as shared home gyms, with cardio at 45% (between the average member''s 35% and the cardio/wellness
    47%; HFA finds treadmills the most-used kit and corporate facilities male-skewed), stretching at 7%,
    and the other 48% split by SFIA''s all-venue strength occasions (dumbbells 37%, machines 19%, barbells
    19%, bodyweight 17%, kettlebells 8%, home use included). Two-thirds of the barbell time moves to dumbbells
    (dumbbell bench is the most common swap for barbell bench in Fitbod''s logs) and 40% of machine time
    to a cable or functional trainer, leaving few heavy barbell stations. Density is 5 per 1,000 sq ft
    from the nearest measured format, small 24/7 clubs (Anytime Fitness averages 660 members on 4,000-7,000
    sq ft, about 18 people at the design peak), and items that need large or specialist space (platforms
    needing 144 sq ft and 12-ft ceilings, rigs and wall-ball targets that also need 12 ft, 30-ft-plus
    sled runs, 22-ft battle-rope lanes, heavy plate-loaded leg machines, landmines, curved treadmills,
    105-150 lb dumbbells, GHDs) are excluded, with zero multipliers on the exercises that need them; pull-ups
    go to the dip and chin-up station.'

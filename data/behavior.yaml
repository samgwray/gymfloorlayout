  notes: '55 min is active time on the training floor; door-to-door visits run 68-74 min including changing.
    cv 0.45 comes from a lognormal fit to Boostcamp''s session quantiles (0.48-0.52), shaded down because
    session timers left running inflate the upper tail. idle_share 0.21 weights strength blocks (about
    27% idle: 42.5 min of station holding in a 58-min session) and cardio bouts (about 7% idle: roughly
    2 min of transition per 25-min bout) by the average member''s 35% cardio time; the other profiles
    imply 0.19 (cardio-led) to 0.24 (strength). It is calibrated to the exercises research''s 7.1-min
    mean strength block and includes some real-world waiting, so recalibrate it if block_minutes change
    materially.'

- id: strength
  name: Strength focused
  description: A lifting-focused gym where most members come to train with barbells, dumbbells and plate-loaded
    machines, and cardio is mainly warm-up and conditioning.
  modality_share:
    cardio: 0.2
    barbell: 0.21
    dumbbell: 0.191
    machine: 0.172
    cable: 0.076
    bodyweight: 0.054
    functional: 0.047
    mobility: 0.05
  peak_users_per_1000_sqft: 9
  exercise_multipliers:
    stair_climbing: 1.8
    elliptical_session: 0.55
    upright_cycling: 0.75
    recumbent_cycling: 0.4
    air_bike_intervals: 2.5
    ski_erg_intervals: 2.5
    curved_treadmill_sprint: 2.5
  excluded_equipment:
  - multi_station_gym
  rationale: 'Strength-focused vector from the usage research: after the SFIA trend shift, ATUS time use
    puts strength at about 77% of strength-plus-cardio minutes for 15-24-year-olds and 70% for men, rack,
    platform and bench time is raised toward app lifters (51% of StrengthLog''s top-25 sets are barbell
    lifts), and YMCA equipment tracking found racks, platforms and cable stacks the busiest stations.
    Cardio multipliers follow the research''s strength-gym cardio mix: stair climbers up 1.8x (Planet
    Fitness added them for high utilization, Garmin stair activities rose 25% in 2024, PureGym managers
    rank them fourth most used) and ellipticals and upright and recumbent bikes down (HFA elliptical use
    fell from 23.2% to 18.8% of members in 2021-24; Planet Fitness calls bikes and ellipticals far less
    used), with interval machines capped at 2.5x because their shares are pure estimates. Density is 9
    per 1,000 sq ft because racks and platforms need 130-144 sq ft per station (NSCA) and this floor spends
    less time on compact cardio units. Multi-station gyms are excluded: makers build them for light-commercial
    rooms such as hotels and apartment buildings (Hoist H4400), not for a lifting floor, so machine work
    goes to single-station selectorized and plate-loaded machines.'

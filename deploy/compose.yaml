# gymfloorlayout.com on one server: Caddy (HTTPS) in front of the site, which proxies /api/* to the
# planning service. Only Caddy is reachable from outside.
name: gymfloorlayout

services:
  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    image: gymfloorlayout-api
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    image: gymfloorlayout-web
    restart: unless-stopped
    depends_on:
      - api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config:
